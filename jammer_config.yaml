# ══════════════════════════════════════════════════════════════════
# jammer_config.yaml — Jammer-scenario GIF demo (run_jammer_demo)
#
# Edit the `scenarios:` list below to dictate what the jammer does:
#   motion: "static" | "drift"      (drift needs theta_drift_deg_per_s +
#                                     phi_drift_deg_per_s [deg/s], independent
#                                     per axis)
#   power:  "constant" | "step" | "onoff" | "window"
#       step   -> power_step_db + step_time_s
#       onoff  -> duty_cycle + toggle_period_s (periodic from t = 0)
#       window -> on_time_s + off_time_s (silent outside [on, off))
#   theta_j_deg + phi_j_deg : fixed jammer position [deg]
#                  (omit both for a per-seed random draw; must respect
#                  guard_deg — true spherical separation from theta_s/phi_s)
#   jn_ratio_db  : per-scenario jammer strength (overrides antijam default)
#   duration_s   : per-scenario run length (overrides sim.duration_s)
#   theta_jump_deg (+ optional phi_jump_deg) + jump_time_s : optional mid-run jump
#
# Each scenario runs once per algorithm in antijam.algorithms and produces
#   vid_<id>_<algorithm>.<ext>  — full 2-D radiation-pattern heatmap over time
#   (native theta/phi, no 1-D cut — [P7]), jammer dot (size ~ amplitude,
#   filled while ON) at its TRUE position, live SINR + gain traces —
# plus a KPI table, under results/jammer_demo/<timestamp>/.
# NOTE: block-style nesting only (the MATLAB YAML reader has no {a: 1} maps).
# ══════════════════════════════════════════════════════════════════

element_patterns_dir: "data/spacing0.6"
polarization: "Copol"

antijam:
  theta_s_deg: 30.0
  phi_s_deg: 90.0
  sinr_min_db: 15.0
  sigma_s_db: 3.0           # jammer-free SINR ~15.3 dB on this array
  jn_ratio_db: 20.0         # default J/N; scenarios may override
  guard_deg: 45.0
  algorithms: ["lcmv", "spsa", "bandit"]

  # ── The scenario suite of this demo ─────────────────────────────
  scenarios:
    - id: "HOP45_180_to_100_150"   # 2 appearances @ (45,180), then jump, 2 @ (100,150)
      motion: "static"
      theta_j_deg: 45.0         # initial location (theta, phi)
      phi_j_deg: 180.0
      theta_jump_deg: 55.0      # +55 -> theta 100 at t = jump_time_s
      phi_jump_deg: -30.0       # -30 -> phi 150
      jump_time_s: 10.0         # relocate during the OFF gap after 2 appearances
      power: "onoff"
      duty_cycle: 0.5           # 2.5 s ON / 2.5 s OFF -> one appearance per 5 s cycle
      toggle_period_s: 5.0
      duration_s: 20.0          # appearances at ~0-2.5, 5-7.5 (loc1), 10-12.5, 15-17.5 (loc2)

sim:
  dt_s: 0.05
  duration_s: 60.0
  snapshots_per_step: 16
  seed: 1234

adapt:
  diagonal_loading_db: 10
  forgetting_lambda: 0.98
  spsa:
    a: 2.0
    c: 0.2
    alpha: 0.602
    gamma: 0.101
    A: 15
    step_max: 0.3

agent:
  # [P7]: null_grid_deg widened from the old 1-D-cut value (10) for a
  # tractable 2-D candidate count; null_rank_cap is a new required key
  # (bounds the null-window projection rank — see agent_codebook_build.m).
  null_grid_deg: 30.0
  null_width_deg: 20.0
  peak_width_deg: 15.0
  null_weight: 100.0
  null_rank_cap: 10
  method: "thompson"
  discount: 0.99
  sigma_tilde_db: 1.0
  window: 50
  optimizer:
    max_iterations: 150
    cost_tolerance: 1.0e-8
    n_restarts: 1
    use_uniform_init: true
    use_single_element_init: false
    amplitude_bounds: [0.0, 1.0]

gif:
  format: "mp4"             # "gif" | "mp4" (MPEG-4 H.264, ~20x smaller files)
  max_frames: 120           # frames per video (subsampled from the sim steps)
  fps: 10
  dynamic_range_db: 40      # color span below the pattern peak

output:
  results_dir: "results/"

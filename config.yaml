# ══════════════════════════════════════════════════════════════════
# config.yaml — Antenna Array Pattern Optimization Configuration
#
# Fill in all required fields before running run_optimization.py.
# Optional fields are marked with [optional] and have defaults shown.
# ══════════════════════════════════════════════════════════════════


# ────────────────────────── DATA PATHS ────────────────────────────

# Path to the folder containing all CST element pattern .txt files.
# One file per array element. All files in this folder are loaded.
# The number of elements is inferred from the number of files found.
# element_patterns_dir: "data/spacing0.9/"
element_patterns_dir: "data/ManyDipoles/"

# ────────────────────────── POLARIZATION ──────────────────────────

# Which field component to use for optimization.
# Options:
#   "copol"       — Co-polarization (Abs(Copol) + Phase(Copol)). Default.
#   "cross"       — Cross-polarization (Abs(Cross) + Phase(Cross)).
#   "total"       — Total E-field power |E_copol|² + |E_xpol|².
#                   Manual tuner only (not wired through run_optimization.py).
polarization: "Theta"


# ────────────────────────── OPTIMIZATION DIRECTIVES ───────────────

# List of beam shaping directives.
# Each directive has:
#   type    : "peak" or "null"
#   theta   : target elevation angle in degrees (0° = boresight / broadside)
#   phi     : target azimuth angle in degrees [optional, default: 0.0]
#   width   : angular window in degrees over which the constraint applies
#             For "peak": this is the desired Half-Maximum Beam Width (HMBW)
#             For "null": total null width to suppress
#   level   : [optional]
#             For "peak": desired gain level in dBi (informational target for metrics)
#             For "null": desired null depth in dB relative to peak (e.g. -30.0)
#   width       : full angular window width in both θ and φ (symmetric shorthand).
#                 Ignored when theta_width / phi_width are both set.
#   theta_width : [optional] independent elevation window width (overrides width).
#   phi_width   : [optional] independent azimuth window width (overrides width).
#   weight      : [optional, default: 1.0] relative priority in the composite cost function.
#                 Higher weight = stronger enforcement of this directive.
#   aggregation : [optional, default: "mean"] how power is summarised across the window.
#                 "mean" — solid-angle-weighted mean power (smooth gradients, default)
#                 "max"  — max power in window (null: drive down worst-case sidelobe)
#                 "min"  — min power in window (peak: enforce flat / filled beam)

directives:
  # - type:   "peak"
  #   theta:  30.0          # degrees — boresight
  #   phi:    30.0          # degrees
  #   width:  20.0         # degrees — desired HMBW
  #   level:  null         # dBi — set to null if unknown; metrics will report achieved value
  #   weight: 5.0

  - type:   "peak"
    theta:  90.0          # degrees — boresight
    phi:    0.0          # degrees
    theta_width:  1.0         # degrees — total suppression window in theta
    phi_width:    360.0         # degrees — total suppression window in phi
    level:  null         # dBi — set to null if unknown; metrics will report achieved value
    weight: 1.0
    aggregation: "min"

  # - type:   "null"
  #   theta:  -30.0          # degrees — boresight
  #   phi:    0.0          # degrees
  #   theta_width:  10.0         # degrees — total suppression window in theta
  #   phi_width:    10.0         # degrees — total suppression window in phi
  #   level:  null         # dBi — set to null if unknown; metrics will report achieved value
  #   weight: 10.0

  # - type:   "null"
  #   theta:  60.0         # degrees — interference direction
  #   phi:    345.0          # degrees
  #   theta_width:  5.0         # degrees — total suppression window in theta
  #   phi_width:    360.0         # degrees — total suppression window in phi
  #   level:  -20.0        # dB — desired null depth relative to peak
  #   weight: 100.0          # higher weight: 2.0 for null enforcement is twice as important as peak
  #   aggregation: "mean"

  # - type:   "null"
  #   theta:  180.0         # degrees — interference direction
  #   phi:    0.0          # degrees
  #   width:  5.0         # degrees — total suppression window
  #   level:  -20.0        # dB — desired null depth relative to peak
  #   weight: 2.5          # higher weight: 2.0 for null enforcement is twice as important as peak


# ────────────────────────── OPTIMIZER SETTINGS ────────────────────

optimizer:
  # Maximum L-BFGS-B iterations allowed per restart.
  # The optimizer may stop earlier when cost_tolerance is satisfied.
  # Total iteration budget ≈ n_restarts × max_iterations (upper bound).
  max_iterations: 250

  # Relative cost improvement tolerance (scipy ftol / fmincon FunctionTolerance).
  # Stops when: |J_k - J_{k+1}| / max(|J_k|, 1) < cost_tolerance
  # Smaller = finer convergence, slower.
  # Suggested range: 1e-6 (fast/exploratory) → 1e-10 (production accuracy).
  cost_tolerance: 1.0e-6

  # Gradient-norm stopping threshold (scipy gtol / fmincon OptimalityTolerance).
  # Stops when the infinity norm of the projected gradient < gradient_tolerance.
  # Independent of cost_tolerance — whichever fires first wins.
  # Suggested range: 1e-4 (fast/exploratory) → 1e-6 (production accuracy).
  gradient_tolerance: 1.0e-5

  # Number of independent optimization runs (multi-start).
  # Run 1 always starts from uniform weights [amplitude=1, phase=0] — deterministic.
  # Runs 2+ start from random unit-amplitude phases to help escape local minima.
  # All restarts use a fixed seed, so results are fully reproducible run-to-run.
  # Increase to 10–20 if the result looks like a local minimum.
  #
  # In addition to n_restarts, one run per array element is automatically performed,
  # starting with that element at weight=1 and all others at 0 (single-element beam).
  # This adds N_elements extra restarts (e.g. +16 for a 16-element array) and all
  # trajectories are shown in the convergence plot.
  n_restarts: 2

  # Amplitude bounds per element [min, max]. Set to null for unbounded.
  # Example: [0.0, 1.0] constrains amplitudes to the range [0, 1].
  amplitude_bounds: [0.0, 1.0]

  # If true, fix all amplitudes to 1.0 and optimize phase only.
  # Overrides amplitude_bounds.
  phase_only: false

  # If true, fix all phases to 0 and optimize amplitudes only.
  # Uses a length-N variable vector with exact amplitude bounds [a_min, a_max].
  # Mutually exclusive with phase_only.
  amplitude_only: false

  # If true, include a deterministic uniform-weights run (amplitude=1, phase=0)
  # as the first restart. Useful baseline; disable if you only want random inits.
  use_uniform_init: false

  # If true, add one run per array element starting with that element active
  # (weight=1) and all others zeroed. Adds N_elements restarts on top of
  # n_restarts. Disable to reduce total run count.
  use_single_element_init: true


# ────────────────────────── OUTPUT SETTINGS ───────────────────────

output:
  # Directory where results (weights, plots, metrics) are saved.
  # A timestamped subfolder is created automatically on each run.
  results_dir: "results/"

  # Pattern cut to plot in Cartesian and polar views.
  # "auto":      automatically use theta_cut at the first peak directive's phi.
  # "theta_cut": elevation sweep at fixed Phi = plot_phi_deg.
  # "phi_cut":   azimuth sweep at fixed Theta = plot_theta_deg.
  # Directive overlays are only drawn when the cut passes through the window.
  plot_cut_type: "auto"
  plot_phi_deg:  0.0    # used when plot_cut_type = "theta_cut"
  plot_theta_deg: 90.0  # used when plot_cut_type = "phi_cut"

  # Dynamic range for polar and Cartesian pattern plots (dB span from peak to floor).
  plot_dynamic_range_db: 40

  # Save polar plot of the array pattern.
  save_polar_plot: true

  # Save Cartesian (dB vs angle) plot.
  save_cartesian_plot: true

  # Save 2D theta-phi heatmap of the full pattern with directive markers.
  save_2d_projection_plot: true

  # Save weight amplitude and phase bar charts.
  save_weight_plots: true

  # Save cost function convergence plot.
  save_cost_history_plot: true

  # Use equal-area cylindrical projection (y-axis = cos θ) for the 2D heatmap.
  # Each equal vertical step represents equal solid angle (dΩ = sin θ dθ dφ).
  # Set to false to revert to the flat θ-axis (Mercator-style) view.
  plot_equal_area: false

  # Save animated GIF showing the radiation pattern evolving over optimizer
  # iterations for the best restart. Requires pillow (pip install pillow).
  save_pattern_gif: true

  # Maximum number of frames in the GIF. Strides automatically when the
  # iteration count exceeds this value.
  gif_max_frames: 100


# ══════════════════════════════════════════════════════════════════
# ANTI-JAM MILESTONE (antijam_milestone_plan.md, MATLAB/antijam_utils/)
# Consumed by run_antijam. All four sections below are required by it;
# missing keys raise descriptive errors (no silent defaults).
# NOTE: keep nesting block-style — the MATLAB YAML reader does not
# support inline flow mappings ({a: 1}).
# ══════════════════════════════════════════════════════════════════

antijam:
  # Desired peak direction along the cut axis [deg] and the operating
  # threshold: "system still operates" when SINR >= sinr_min_db.
  theta_s_deg: 0.0
  sinr_min_db: 10.0

  # Power levels relative to the sigma_n^2 = 1 per-element noise floor.
  # sigma_s_db = 3 places the jammer-free SINR at ~15.3 dB for the
  # ManyDipoles Theta cut (quiescent gain 12.3 dB) -> 5 dB headroom over
  # sinr_min_db. [P6 calibration]
  sigma_s_db: 3.0           # desired-signal power [dB]
  jn_ratio_db: 20.0         # jammer-to-noise ratio [dB]

  # Jammer exclusion sector around the main beam [deg] (single-jammer
  # milestone limitation: jammer inside the main beam is out of scope).
  # ~3 beamwidths for the measured 15 deg HPBW of the ManyDipoles cut:
  # null windows closer than this eat into the main lobe (P4 finding).
  guard_deg: 45.0

  # 1-D azimuth cut the engine operates on (mirrors output.plot_cut_type).
  # "phi_cut"   : azimuth sweep at fixed Theta = cut_theta_deg (use for the
  #               ManyDipoles data: ring peak at theta = 90).
  # "theta_cut" : principal plane combining phi = cut_phi_deg / +180
  #               half-planes into a -90..+90 deg axis.
  cut_type: "phi_cut"
  cut_theta_deg: 90.0       # used when cut_type = "phi_cut"
  cut_phi_deg: 0.0          # used when cut_type = "theta_cut"

  # Algorithms to run in the campaign. Modes are fixed per algorithm:
  # oracle, lcmv -> Mode C (snapshots); spsa, bandit -> Mode S (scalar SINR).
  algorithms: ["oracle", "lcmv", "spsa", "bandit"]

  # Standard scenario suite (plan Section 5). motion: "static" | "drift";
  # power: "constant" | "step" | "onoff". Static/initial angle is drawn per
  # seed, uniform over the cut span minus the guard sector.
  scenarios:
    - id: "S1"              # identification baseline
      motion: "static"
      power: "constant"
    - id: "S2"              # primary tracking case
      motion: "drift"
      drift_deg_per_s: 2.0
      power: "constant"
    - id: "S3"              # recovery-time case
      motion: "drift"
      drift_deg_per_s: 2.0
      jump_deg: 10.0
      jump_time_s: 30.0
      power: "constant"
    - id: "S4"              # robustness (power step)
      motion: "static"
      power: "step"
      power_step_db: 10.0
      step_time_s: 30.0
    - id: "S5"              # non-stationarity stress (on/off)
      motion: "drift"
      drift_deg_per_s: 2.0
      power: "onoff"
      duty_cycle: 0.5
      toggle_period_s: 10.0
    - id: "S6"              # null lifecycle: silent 1 min -> static jammer
      motion: "static"      # 1 min -> silent again. Shows the null forming
      power: "window"       # on turn-on and the return to the unconstrained
      on_time_s: 60.0       # peak after turn-off.
      off_time_s: 120.0
      duration_s: 180.0     # per-scenario override of sim.duration_s

sim:
  dt_s: 0.05                # closed-loop step [s]
  duration_s: 60.0
  snapshots_per_step: 16    # Mode C snapshot count K per step
  seed: 1234                # base seed; Monte Carlo runs offset from it
  n_runs: 5                 # Monte Carlo runs per scenario x algorithm

adapt:
  # Diagonal loading for LCMV, dB relative to the sigma_n^2 = 1 noise floor.
  # P2 sweep result: snapshots contain the desired signal (MPDR), so light
  # loading self-nulls the signal — at J/N = 20 dB, +10 dB loading gave
  # oracle gap 0.8 dB vs 2-3.7 dB at -10 dB. Keep well below the jammer
  # eigenvalue (~ J/N + 10*log10(N_el) dB) or nulling degrades.
  diagonal_loading_db: 10
  # Exponential forgetting factor for the recursive covariance estimate.
  forgetting_lambda: 0.98
  # SPSA gains: a_k = a / (A + k)^alpha, c_k = c / k^gamma; ascent steps are
  # clamped to norm <= step_max. P3 sweep: A and step_max are load-bearing —
  # the dB-scale SINR gradient explodes near deep nulls, and unclamped steps
  # strand the estimate on a plateau (fails the static gate on most seeds).
  spsa:
    a: 2.0
    c: 0.2
    alpha: 0.602
    gamma: 0.101
    A: 15
    step_max: 0.3

agent:
  # P6 real-data sweep: 20-deg windows on a 10-deg grid (28 arms) keep the
  # arm count inside the discount horizon (~100 probes at 0.99) and halve
  # drift handoffs vs the 5-deg/10-deg plan defaults; wider windows or denser
  # overlap performed worse (see notes.md [P6]).
  null_grid_deg: 10.0       # codebook arm spacing along the cut axis
  null_width_deg: 20.0      # null-sector width per arm (> spacing = overlap)
  peak_width_deg: 15.0      # peak-directive window ~= measured HPBW (15 deg)
  null_weight: 100.0        # null-vs-peak weight in the arm synthesis cost
  method: "thompson"        # "thompson" | "swucb"
  discount: 0.99            # discounted TS; horizon 1/(1-d) must exceed n_arms
  sigma_tilde_db: 1.0       # posterior scale; sets exploration overhead
  window: 50                # sliding-window UCB alternative
  # Optimizer settings for OFFLINE codebook synthesis (lighter than the main
  # `optimizer:` section — one deterministic uniform-init run per arm; the
  # null-space projection polish does the depth work).
  optimizer:
    max_iterations: 150
    cost_tolerance: 1.0e-8
    n_restarts: 1
    use_uniform_init: true
    use_single_element_init: false
    amplitude_bounds: [0.0, 1.0]

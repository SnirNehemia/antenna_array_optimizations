# ══════════════════════════════════════════════════════════════════
# config.yaml — Antenna Array Pattern Optimization Configuration
#
# Fill in all required fields before running run_optimization.py.
# Optional fields are marked with [optional] and have defaults shown.
# ══════════════════════════════════════════════════════════════════


# ────────────────────────── DATA PATHS ────────────────────────────

# Path to the folder containing all CST element pattern .txt files.
# One file per array element. All files in this folder are loaded.
# The number of elements is inferred from the number of files found.
# element_patterns_dir: "data/spacing0.6/"
# element_patterns_dir: "data/ManyDipoles/"
element_patterns_dir: "data/patchs_with_monopoles/"

# ────────────────────────── POLARIZATION ──────────────────────────

# Which field component to use for optimization.
# Options:
#   "copol" / "theta"       — Co-polarization (Abs(Copol) + Phase(Copol)). Default.
#   "cross"       — Cross-polarization (Abs(Cross) + Phase(Cross)).
#   "total"       — Total E-field power |E_copol|² + |E_xpol|².
#                   Manual tuner only (not wired through run_optimization.py).
polarization: "total"


# ────────────────────────── OPTIMIZATION DIRECTIVES ───────────────

# List of beam shaping directives.
# Each directive has:
#   type    : "peak" or "null"
#   theta   : target elevation angle in degrees (0° = boresight / broadside)
#   phi     : target azimuth angle in degrees [optional, default: 0.0]
#   width   : angular window in degrees over which the constraint applies
#             For "peak": this is the desired Half-Maximum Beam Width (HMBW)
#             For "null": total null width to suppress
#   level   : [optional]
#             For "peak": desired gain level in dBi (informational target for metrics)
#             For "null": desired null depth in dB relative to peak (e.g. -30.0)
#   width       : full angular window width in both θ and φ (symmetric shorthand).
#                 Ignored when theta_width / phi_width are both set.
#   theta_width : [optional] independent elevation window width (overrides width).
#   phi_width   : [optional] independent azimuth window width (overrides width).
#   weight      : [optional, default: 1.0] relative priority in the composite cost function.
#                 Higher weight = stronger enforcement of this directive.
#   aggregation : [optional, default: "mean"] how power is summarised across the window.
#                 "mean" — solid-angle-weighted mean power (smooth gradients, default)
#                 "max"  — max power in window (null: drive down worst-case sidelobe)
#                 "min"  — min power in window (peak: enforce flat / filled beam)

directives:
  # - type:   "peak"
  #   theta:  30.0          # degrees — boresight
  #   phi:    30.0          # degrees
  #   width:  20.0         # degrees — desired HMBW
  #   level:  null         # dBi — set to null if unknown; metrics will report achieved value
  #   weight: 5.0

  - type:   "peak"
    theta:  90.0          # degrees — boresight
    phi:    0.0          # degrees
    theta_width:  1.0         # degrees — total suppression window in theta
    phi_width:    360.0         # degrees — total suppression window in phi
    level:  null         # dBi — set to null if unknown; metrics will report achieved value
    weight: 1.0
    aggregation: "min"

  # - type:   "null"
  #   theta:  -30.0          # degrees — boresight
  #   phi:    0.0          # degrees
  #   theta_width:  10.0         # degrees — total suppression window in theta
  #   phi_width:    10.0         # degrees — total suppression window in phi
  #   level:  null         # dBi — set to null if unknown; metrics will report achieved value
  #   weight: 10.0

  # - type:   "null"
  #   theta:  60.0         # degrees — interference direction
  #   phi:    345.0          # degrees
  #   theta_width:  5.0         # degrees — total suppression window in theta
  #   phi_width:    360.0         # degrees — total suppression window in phi
  #   level:  -20.0        # dB — desired null depth relative to peak
  #   weight: 100.0          # higher weight: 2.0 for null enforcement is twice as important as peak
  #   aggregation: "mean"

  # - type:   "null"
  #   theta:  180.0         # degrees — interference direction
  #   phi:    0.0          # degrees
  #   width:  5.0         # degrees — total suppression window
  #   level:  -20.0        # dB — desired null depth relative to peak
  #   weight: 2.5          # higher weight: 2.0 for null enforcement is twice as important as peak


# ────────────────────────── OPTIMIZER SETTINGS ────────────────────

optimizer:
  # Maximum L-BFGS-B iterations allowed per restart.
  # The optimizer may stop earlier when cost_tolerance is satisfied.
  # Total iteration budget ≈ n_restarts × max_iterations (upper bound).
  max_iterations: 250

  # Relative cost improvement tolerance (scipy ftol / fmincon FunctionTolerance).
  # Stops when: |J_k - J_{k+1}| / max(|J_k|, 1) < cost_tolerance
  # Smaller = finer convergence, slower.
  # Suggested range: 1e-6 (fast/exploratory) → 1e-10 (production accuracy).
  cost_tolerance: 1.0e-6

  # Gradient-norm stopping threshold (scipy gtol / fmincon OptimalityTolerance).
  # Stops when the infinity norm of the projected gradient < gradient_tolerance.
  # Independent of cost_tolerance — whichever fires first wins.
  # Suggested range: 1e-4 (fast/exploratory) → 1e-6 (production accuracy).
  gradient_tolerance: 1.0e-5

  # Number of independent optimization runs (multi-start).
  # Run 1 always starts from uniform weights [amplitude=1, phase=0] — deterministic.
  # Runs 2+ start from random unit-amplitude phases to help escape local minima.
  # All restarts use a fixed seed, so results are fully reproducible run-to-run.
  # Increase to 10–20 if the result looks like a local minimum.
  #
  # In addition to n_restarts, one run per array element is automatically performed,
  # starting with that element at weight=1 and all others at 0 (single-element beam).
  # This adds N_elements extra restarts (e.g. +16 for a 16-element array) and all
  # trajectories are shown in the convergence plot.
  n_restarts: 2

  # Amplitude bounds per element [min, max]. Set to null for unbounded.
  # Example: [0.0, 1.0] constrains amplitudes to the range [0, 1].
  amplitude_bounds: [0.0, 1.0]

  # If true, fix all amplitudes to 1.0 and optimize phase only.
  # Overrides amplitude_bounds.
  phase_only: false

  # If true, fix all phases to 0 and optimize amplitudes only.
  # Uses a length-N variable vector with exact amplitude bounds [a_min, a_max].
  # Mutually exclusive with phase_only.
  amplitude_only: false

  # If true, include a deterministic uniform-weights run (amplitude=1, phase=0)
  # as the first restart. Useful baseline; disable if you only want random inits.
  use_uniform_init: false

  # If true, add one run per array element starting with that element active
  # (weight=1) and all others zeroed. Adds N_elements restarts on top of
  # n_restarts. Disable to reduce total run count.
  use_single_element_init: true


# ────────────────────────── OUTPUT SETTINGS ───────────────────────

output:
  # Directory where results (weights, plots, metrics) are saved.
  # A timestamped subfolder is created automatically on each run.
  results_dir: "results/"

  # Pattern cut to plot in Cartesian and polar views.
  # "auto":      automatically use theta_cut at the first peak directive's phi.
  # "theta_cut": elevation sweep at fixed Phi = plot_phi_deg.
  # "phi_cut":   azimuth sweep at fixed Theta = plot_theta_deg.
  # Directive overlays are only drawn when the cut passes through the window.
  plot_cut_type: "auto"
  plot_phi_deg:  0.0    # used when plot_cut_type = "theta_cut"
  plot_theta_deg: 90.0  # used when plot_cut_type = "phi_cut"

  # Dynamic range for polar and Cartesian pattern plots (dB span from peak to floor).
  plot_dynamic_range_db: 40

  # Save polar plot of the array pattern.
  save_polar_plot: true

  # Save Cartesian (dB vs angle) plot.
  save_cartesian_plot: true

  # Save 2D theta-phi heatmap of the full pattern with directive markers.
  save_2d_projection_plot: true

  # Save weight amplitude and phase bar charts.
  save_weight_plots: true

  # Save cost function convergence plot.
  save_cost_history_plot: true

  # Use equal-area cylindrical projection (y-axis = cos θ) for the 2D heatmap.
  # Each equal vertical step represents equal solid angle (dΩ = sin θ dθ dφ).
  # Set to false to revert to the flat θ-axis (Mercator-style) view.
  plot_equal_area: false

  # Save animated GIF showing the radiation pattern evolving over optimizer
  # iterations for the best restart. Requires pillow (pip install pillow).
  save_pattern_gif: true

  # Maximum number of frames in the GIF. Strides automatically when the
  # iteration count exceeds this value.
  gif_max_frames: 100


# ══════════════════════════════════════════════════════════════════
# ANTI-JAM MILESTONE (antijam_milestone_plan.md, MATLAB/antijam_utils/)
# Consumed by run_antijam. All four sections below are required by it;
# missing keys raise descriptive errors (no silent defaults).
# NOTE: keep nesting block-style — the MATLAB YAML reader does not
# support inline flow mappings ({a: 1}).
# ══════════════════════════════════════════════════════════════════

antijam:
  # Desired peak direction [deg] and the operating threshold: "system still
  # operates" when SINR >= sinr_min_db. [P7]: native (theta, phi), no 1-D cut.
  theta_s_deg: 90.0
  phi_s_deg: 260.0
  sinr_min_db: 10.0

  # Power levels relative to the sigma_n^2 = 1 per-element noise floor.
  # sigma_s_db = 3 places the jammer-free SINR at ~15.3 dB for the
  # ManyDipoles Theta cut (quiescent gain 12.3 dB) -> 5 dB headroom over
  # sinr_min_db. [P6 calibration]
  sigma_s_db: 20.0           # desired-signal power [dB]
  jn_ratio_db: 20.0         # jammer-to-noise ratio [dB]

  # [P10] Array design / CST export frequency [Hz]. Read only when the waveform
  # layer is on (sim.fs_hz); all engine maths runs in baseband OFFSETS from it,
  # so this is for labelling absolute frequencies in reports. The narrowband
  # assumption behind the whole milestone is that element patterns do not vary
  # across the captured band — true to first order at ~1% fractional bandwidth.
  f_center_hz: 2.4e9

  # Jammer exclusion sector around the main beam [deg] (single-jammer
  # milestone limitation: jammer inside the main beam is out of scope).
  # ~3 beamwidths for the measured 15 deg HPBW of the ManyDipoles cut:
  # null windows closer than this eat into the main lobe (P4 finding).
  guard_deg: 5.0

  # Algorithms to run in the campaign. Modes are fixed per algorithm:
  # oracle, lcmv -> Mode C (snapshots); spsa, bandit -> Mode S (scalar SINR).
  algorithms: ["oracle", "lcmv", "predict", "spsa", "bandit"]

  # Standard scenario suite (plan Section 5). motion: "static" | "drift";
  # power: "constant" | "step" | "onoff". Static/initial angle is drawn per
  # seed, uniform over the cut span minus the guard sector.
  # [P10] freq: "constant" (+ f_j_offset_hz) | "hop" (+ f_j_hop_offsets_hz +
  # f_j_hop_period_s), as an offset from antijam.f_center_hz. These are inert
  # while sim.fs_hz is off; they are pre-populated so that turning the waveform
  # layer on does not require touching every scenario. Offsets are spread over
  # the band and deliberately NOT on FFT bin centres (fs/K = 187.5 kHz), so the
  # sub-bin interpolation is actually exercised rather than flattered.
  scenarios:
    - id: "S1"              # identification baseline
      motion: "static"
      power: "constant"
      freq: "constant"
      f_j_offset_hz: 3.1e6
    - id: "S2"              # primary tracking case
      motion: "drift"
      theta_drift_deg_per_s: 2.0
      phi_drift_deg_per_s: 0.0
      power: "constant"
      freq: "constant"
      f_j_offset_hz: -5.37e6
    - id: "S3"              # recovery-time case
      motion: "drift"
      theta_drift_deg_per_s: 2.0
      phi_drift_deg_per_s: 0.0
      theta_jump_deg: 10.0
      jump_time_s: 30.0
      power: "constant"
      freq: "constant"
      f_j_offset_hz: 8.02e6
    - id: "S4"              # robustness (power step)
      motion: "static"
      power: "step"
      power_step_db: 10.0
      step_time_s: 30.0
      freq: "constant"
      f_j_offset_hz: -1.23e6
    - id: "S5"              # non-stationarity stress (on/off)
      motion: "drift"
      theta_drift_deg_per_s: 2.0
      phi_drift_deg_per_s: 0.0
      power: "onoff"
      duty_cycle: 0.5
      toggle_period_s: 10.0
      freq: "constant"
      f_j_offset_hz: 6.44e6
    - id: "S6"              # null lifecycle: silent 1 min -> static jammer
      motion: "static"      # 1 min -> silent again. Shows the null forming
      power: "window"       # on turn-on and the return to the unconstrained
      on_time_s: 60.0       # peak after turn-off.
      off_time_s: 120.0
      duration_s: 180.0     # per-scenario override of sim.duration_s
      freq: "constant"
      f_j_offset_hz: -9.11e6
    - id: "S7"              # [P10] carrier hop: same angle, new frequency.
      motion: "static"      # Isolates the spectral loop — the spatial null is
      power: "constant"     # already correct, so any SINR notch at t = 20/40/60
      freq: "hop"           # s is the notch re-acquiring, nothing else.
      f_j_hop_offsets_hz: [3.1e6, -7.45e6]
      f_j_hop_period_s: 20.0

sim:
  dt_s: 0.05                # closed-loop step [s]
  duration_s: 60.0
  # Mode C snapshot count K per step. [P8, 2026-08-01] Was 16; raised to 128
  # after the adapt_tracking_update/adapt_predict_update batching fix made K a
  # genuine per-step noise-reduction knob (previously it silently accelerated
  # forgetting instead — see forgetting_lambda note below). K=128 alone (same
  # loading/lambda) cut the mode_c_demo static-jammer steady-state oracle gap
  # from 6.04+-3.28 dB to 1.93+-1.24 dB with no reactivity cost — the best
  # "free" smoothing lever found (diagonal_loading_db and forgetting_lambda
  # both trade accuracy or reactivity for smoothness; K does not). Cheap at
  # this array size (16-20 elements).
  snapshots_per_step: 128
  seed: 1234                # base seed; Monte Carlo runs offset from it
  n_runs: 5                 # Monte Carlo runs per scenario x algorithm
  # [P10] Waveform layer. Uncomment to give the jammer a CW carrier that
  # adapt_freq_estimate can find, enabling the RF-notch path below. This is the
  # snapshot-block ADC rate — the captured bandwidth — NOT related to dt_s: the
  # K columns are a K/fs_hz = 5.3 us capture burst inside each 0.05 s control
  # step. 24 MHz is ~1% of the 2.4 GHz centre, the customer's search window.
  # While this key is absent the snapshot generator is byte-identical to the
  # pre-P10 path, so every P1-P9 result stands unchanged.
  # Requires: every scenario carries a "freq" key (all seven above do).
  # fs_hz: 24.0e6

adapt:
  # Diagonal loading for LCMV, dB relative to the sigma_n^2 = 1 noise floor.
  # P2 sweep result: snapshots contain the desired signal (MPDR), so light
  # loading self-nulls the signal — at J/N = 20 dB, +10 dB loading gave
  # oracle gap 0.8 dB vs 2-3.7 dB at -10 dB. Keep well below the jammer
  # eigenvalue (~ J/N + 10*log10(N_el) dB) or nulling degrades.
  # [P8, 2026-08-01/02] Tried raising to 14 dB alongside the snapshots_per_step
  # re-tune below, but re-swept against the demo's actual scenario
  # (mode_c_demo.md's ONOFF case, 25 dB jammer / 20 s toggle) and found plain
  # 10 dB + K=128 slightly BEATS 14 dB (gap 2.06 vs 2.33 dB) — kept at 10.
  # Heavier loading is not a good smoothing knob here regardless: 25 dB loading
  # makes both accuracy AND noise worse (starves achievable null depth; see
  # docs/notes.md [P8] 2026-08-01 sweep, panel F).
  diagonal_loading_db: 10
  # [P9, 2026-08-02] Trial: data-driven loading (see antijam_milestone_plan.md
  # P9). Opt-in — set to try it, remove/comment to fall back to the fixed
  # diagonal_loading_db above. loading = loading_factor * sqrt(sig_power_hat *
  # noise_floor_hat); 0 dB (factor=1) empirically reproduces the old tuned
  # ~10 in the calibrated weak-signal regime and lands near the empirical
  # optimum in the sigma_s_db=30 regime that motivated this phase — no
  # additional scaling needed as a starting point.
  loading_factor_db: 0
  # Exponential forgetting factor for the recursive covariance estimate,
  # applied ONCE per step to the within-step batch-averaged snapshot
  # covariance (adapt_tracking_update / adapt_predict_update).
  # [P8 fix, 2026-08-01] Was 0.98, chosen by the original P2 sweep against a
  # bug where the K snapshots/step were folded in via K SEQUENTIAL per-column
  # recursions instead of one batch-averaged update — that accidentally
  # applied ~lambda^K decay per step (0.98^16 = 0.72), not the documented
  # per-step 0.98. Fixing the accumulation to match the plan's formula
  # (Section 2) exposed that 0.98 is now far too slow (a 5 s on/off gap no
  # longer fully decays -> adapt_predict's presence detector never resets;
  # see test_antijam_predict). Re-swept to 0.90 (gate-test fixtures pin the
  # same value — see test_antijam_tracking.m/test_antijam_predict.m headers).
  # NOTE: the gate-test suites are self-contained (own hardcoded acfg,
  # unaffected by this file) — only run_antijam / the mode_c_demo script
  # actually read config.yaml.
  forgetting_lambda: 0.90
  # [P8, 2026-08-01/02] Optional: rate-limits the APPLIED weight vector toward
  # the closed-form target instead of snapping to it every step (see
  # adapt_tracking_init.m / smooth_weights in adapt_tracking_update.m).
  # w <- (1-mu)*w + mu*w_target, phase-aligned. mu=1 or key absent = off
  # (original snap-to-target behavior; this is how every gate-test fixture
  # runs, since none set this key). NOT a pure improvement — it adds
  # reacquisition lag (a visible post-toggle dip before climbing) in exchange
  # for a smoother, more gradual rise-to-optimum shape; both grow as mu drops.
  # Swept on the demo's actual ONOFF scenario (25 dB jammer, 20 s toggle) at
  # loading=10dB/lambda=0.90/K=128: mu [1.0, 0.5, 0.35, 0.25, 0.15, 0.10] ->
  # lcmv availability [99.6, 98.3, 97.4, 96.1, 93.1, 89.6]%, oracle gap
  # [2.03, 2.33, 2.60, 3.02, 4.01, 5.25] dB (mu=0.10 dips below the milestone's
  # usual 90% availability floor). 0.25 chosen (2026-08-02, user's pick after
  # reviewing results/mode_c_demo/mu_sweep_traces_v2.png): clearly smoother
  # than off/0.35 while staying comfortably above 90% availability. Remove
  # this key (or set to 1) to fall back to the pre-smoothing behavior.
  weight_smoothing_mu: 0.25
  # SPSA gains: a_k = a / (A + k)^alpha, c_k = c / k^gamma; ascent steps are
  # clamped to norm <= step_max. P3 sweep: A and step_max are load-bearing —
  # the dB-scale SINR gradient explodes near deep nulls, and unclamped steps
  # strand the estimate on a plateau (fails the static gate on most seeds).
  spsa:
    a: 2.0
    c: 0.2
    alpha: 0.602
    gamma: 0.101
    A: 15
    step_max: 0.3
  # [P8] Predictive (anticipatory) Mode C nuller: MUSIC DoA + on/off-period
  # detection -> pre-form the null before the jammer turns back on. Model order
  # is hardcoded to 2 (desired + 1 jammer, single-jammer scope) — not a key.
  # These are initial guesses; expect load-bearing keys to shift under P8 tuning.
  predict:
    presence_gap_db: 6.0    # signal/noise eigengap to declare the jammer present
    buffer_len: 1024        # presence-history window for the periodogram [steps]
                            # (must exceed min_periods * toggle_period_in_steps)
    min_periods: 3          # on/off cycles observed before trusting the period
    lead_steps: 6           # pre-form the null this many steps before turn-on
                            # (cover MUSIC-presence detection lag at turn-on)
    doa_stride: 1           # MUSIC grid subsample (1 = full far-field grid)
  # [P10] Jammer carrier-frequency tracker (adapt_freq_init/update ->
  # adapt_freq_estimate). Only runs when sim.fs_hz turns on the waveform layer;
  # required when notch.mode is "adaptive", since it is what commands the notch.
  freq:
    nfft_factor: 4          # zero-pad factor before the peak search. 8x measured
                            # to add nothing over 4x (343 vs 344 Hz RMSE).
    presence_snr_db: 15.0   # peak-to-median periodogram ratio to declare a line.
                            # Measured on the real array (J/N = 20 dB, K = 128,
                            # nfft 512): jammer ON gives 18.7-23.3 dB, jammer OFF
                            # gives up to 12.6 dB — a white spectrum's max/median
                            # over 512 bins is ~9.5 dB on its own, so 10.0 sat
                            # inside the noise distribution and false-alarmed on
                            # 19% of OFF steps (the tracker then chased noise
                            # peaks instead of HOLDING). 15.0 is 2.4 dB above the
                            # measured OFF max and 3.7 dB below the ON min:
                            # 0% false alarm, 0% missed detection.
    smoothing_lambda: 0.7   # EMA weight on the RETAINED estimate. A single block
                            # is already accurate to a few hundred Hz, so this
                            # buys outlier rejection, not accuracy. A detection
                            # more than 4 periodogram bins away is treated as a
                            # genuine hop and replaces the estimate outright.

agent:
  # [P7]: null_grid_deg widened from the old 1-D-cut value (10) — candidates
  # are now a genuine 2-D (theta, phi) sweep, and arm count grows O(n^2) with
  # grid density (see agent_codebook_build.m header). null_rank_cap is a new
  # required key: it bounds how many singular directions of a 2-D null
  # window the projection polish consumes, since a 2-D window covers far
  # more grid points than the old 1-D cut did for the same width (P6/P7
  # findings). These P6 real-data numbers (10-deg 1-D grid, 28 arms) are NOT
  # re-validated for 2-D yet — re-tune before relying on the campaign KPIs
  # (P7.4 follow-up; see antijam_milestone_plan.md).
  null_grid_deg: 30.0       # codebook arm spacing on BOTH theta and phi axes
  null_width_deg: 20.0      # null-sector width per arm (> spacing = overlap)
  peak_width_deg: 15.0      # peak-directive window ~= measured HPBW (15 deg)
  null_weight: 100.0        # null-vs-peak weight in the arm synthesis cost
  null_rank_cap: 10         # cap on the null-window projection rank
  method: "thompson"        # "thompson" | "swucb"
  discount: 0.99            # discounted TS; horizon 1/(1-d) must exceed n_arms
  sigma_tilde_db: 1.0       # posterior scale; sets exploration overhead
  window: 50                # sliding-window UCB alternative
  # Optimizer settings for OFFLINE codebook synthesis (lighter than the main
  # `optimizer:` section — one deterministic uniform-init run per arm; the
  # null-space projection polish does the depth work).
  optimizer:
    max_iterations: 150
    cost_tolerance: 1.0e-8
    n_restarts: 1
    use_uniform_init: true
    use_single_element_init: false
    amplitude_bounds: [0.0, 1.0]

# ══════════════════════════════════════════════════════════════════
# [P10] RF NOTCH FILTER
# Temporal (spectral) rejection stacked on top of the spatial nulls. Modelled
# as two scalars in the SINR equation (sim_notch_response): a notch is linear
# and time-invariant and identical on every element, so it COMMUTES with the
# beamformer — filtering samples then combining equals scaling the combined
# powers. No filter coefficients are synthesized.
#
# Ships INERT (mode "off") so the pre-P10 campaign is untouched. An active mode
# requires sim.fs_hz; "adaptive" additionally requires adapt.freq, since the
# tracker is what commands the notch centre.
# ══════════════════════════════════════════════════════════════════
notch:
  # "off"      : no notch — the spatial-null-only baseline.
  # "adaptive" : centred on the tracker's estimate. The real system.
  # "oracle"   : centred on the true carrier — the upper bound, for the same
  #              three-way comparison the report already uses for the beamformer.
  mode: "off"
  # Rejection at the notch centre [dB]. Measured cost of a carrier-estimation
  # error: at the estimator's ~0.6 kHz RMSE against bw_hz = 200 kHz, roughly
  # 1 dB of these 35 dB is given up.
  depth_db: 35.0
  # 3-dB width [Hz]. This is the real trade knob: the wideband desired signal
  # loses pi*bw_hz/(2*fs_hz) of its power, so at 200 kHz in a 24 MHz band the
  # notch costs 1.3% = 0.057 dB of signal to remove 35 dB of jammer. Widening it
  # buys tolerance to carrier error at a linear cost in signal.
  bw_hz: 2.0e5
  # "pre"  : monitoring tap UPSTREAM of the notch (recommended, and how real
  #          anti-jam receivers are built). The covariance / DoA / frequency
  #          trackers keep seeing the jammer after the notch engages.
  # "post" : single-path receiver. The notch also erases the jammer from the
  #          snapshots, blinding every tracker that depends on seeing it —
  #          modelled so the failure mode can be demonstrated, not recommended.
  adaptation_tap: "pre"
